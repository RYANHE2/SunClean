<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Dashboard - Sunclean</title>
  <link rel="stylesheet" href="external/LR.css" />
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: #f0f0f0;
      margin: 0;
    }

    .dashboard-container {
      text-align: center;
    }

    .message {
      font-size: 24px;
      color: green;
      margin-bottom: 30px;
    }

    .dashboard-buttons {
      display: flex;
      justify-content: center;
      gap: 20px;
    }

    .dashboard-buttons a {
      padding: 10px 20px;
      background-color: #2d89ef;
      color: white;
      text-decoration: none;
      border-radius: 5px;
      transition: background-color 0.3s;
    }

    .dashboard-buttons a:hover {
      background-color: #1b5cb8;
    }
  </style>
</head>
<body>
  <div class="dashboard-container">
    <div class="message"> You have successfully logged in.</div>
    <div class="dashboard-buttons">
      <a href="home.html">Back to Home</a>
      <a href="login.html">Log Out</a>
    </div>
  </div>
</body>
</html>

</body>
</html>
