<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Registration Successful</title>
  <link rel="stylesheet" href="external/LR.css" />
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: #f9f9f9;
      margin: 0;
    }

    .register-success {
      text-align: center;
    }

    .register-success .message {
      font-size: 24px;
      color: green;
      margin-bottom: 30px;
    }

    .register-success a {
      padding: 10px 20px;
      background-color: #2d89ef;
      color: white;
      text-decoration: none;
      border-radius: 5px;
      transition: background-color 0.3s;
    }

    .register-success a:hover {
      background-color: #1b5cb8;
    }
  </style>
</head>
<body>
  <div class="register-success">
    <div class="message">You have successfully registered!</div>
    <a href="login.html">Proceed to Login</a>
  </div>
</body>
</html>
